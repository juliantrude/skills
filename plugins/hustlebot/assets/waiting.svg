<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 240 150" width="480" height="300" role="img"
           aria-label="Der Roboter steht in der Küche, aus seiner Tasse steigt Dampf, gelegentlich hebt er sie zum Trinken.">
<style>
/* ---- motion --------------------------------------------------------- */
  @keyframes breathe{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes typeL{0%,100%{transform:rotate(0)}50%{transform:rotate(-11deg)}}
  @keyframes typeR{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(0)}}
  @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-60px)}}
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes flicker{0%,100%{opacity:1}50%{opacity:.88}}
  @keyframes steam{0%{transform:translateY(0);opacity:0}
                   35%{opacity:.85}100%{transform:translateY(-26px);opacity:0}}
  @keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  @keyframes snore{0%{transform:translate(0,0) scale(.6);opacity:0}
                   30%{opacity:.9}100%{transform:translate(16px,-30px) scale(1.15);opacity:0}}
  @keyframes pan{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}
  @keyframes bobQ{from{transform:translateY(0)}to{transform:translateY(-5px)}}
  @keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes armUp{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-30deg)}}
  @keyframes fall{from{transform:translateY(-14px) rotate(0);opacity:0}
                  20%{opacity:1}to{transform:translateY(118px) rotate(220deg);opacity:0}}

  .breathe{animation:breathe 2.6s ease-in-out infinite alternate}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  .armL{transform-box:fill-box;transform-origin:top center;animation:typeL .26s ease-in-out infinite}
  .armR{transform-box:fill-box;transform-origin:top center;animation:typeR .26s ease-in-out infinite}
  .scroll{animation:scroll 3.4s linear infinite}
  .caret{animation:caret 1s step-end infinite}
  .screen{animation:flicker 3.2s ease-in-out infinite}
  .steam{animation:steam 2.6s ease-out infinite}
  .steam:nth-of-type(2){animation-delay:.9s}
  .steam:nth-of-type(3){animation-delay:1.7s}
  .sway{transform-box:fill-box;transform-origin:center top;
        animation:sway 3.4s ease-in-out infinite alternate}
  .snore{animation:snore 3s ease-out infinite}
  .snore:nth-of-type(2){animation-delay:1s}
  .snore:nth-of-type(3){animation-delay:2s}
  .pan{transform-box:fill-box;transform-origin:center bottom;animation:pan 3.6s ease-in-out infinite}
  .bobq{animation:bobQ 1.4s ease-in-out infinite alternate}
  .cheer{animation:cheer 1.1s ease-in-out infinite}
  .armup-l{transform-box:fill-box;transform-origin:bottom center;animation:armUp 1.1s ease-in-out infinite}
  .armup-r{transform-box:fill-box;transform-origin:bottom center;animation:armUp 1.1s ease-in-out infinite .1s}
  .confetti rect{animation:fall 2.4s linear infinite}
  .confetti rect:nth-child(2){animation-delay:.5s}
  .confetti rect:nth-child(3){animation-delay:1s}
  .confetti rect:nth-child(4){animation-delay:1.6s}
  .confetti rect:nth-child(5){animation-delay:.25s}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
        <rect width="240" height="150" fill="#4a5470"/>
        <rect y="126" width="240" height="24" fill="#2a3049"/>
        <rect y="124" width="240" height="3" fill="#171a24"/>
        <rect x="0" y="14" width="76" height="34" rx="4" fill="#59627e" stroke="#171a24" stroke-width="4"/>
        <line x1="38" y1="14" x2="38" y2="48" stroke="#171a24" stroke-width="3"/>
        <rect x="28" y="28" width="4" height="8" rx="2" fill="#171a24"/>
        <rect x="44" y="28" width="4" height="8" rx="2" fill="#171a24"/>
        <g class="breathe">
          <rect x="96" y="112" width="18" height="16" rx="4" fill="#a89e8b" stroke="#171a24" stroke-width="3"/>
          <rect x="126" y="112" width="18" height="16" rx="4" fill="#a89e8b" stroke="#171a24" stroke-width="3"/>
          <rect x="72" y="66" width="96" height="52" rx="16" fill="#ded5c4" stroke="#171a24" stroke-width="4"/>
          <circle cx="120" cy="90" r="10" fill="#ff8c42" stroke="#171a24" stroke-width="3"/>
          <rect x="168" y="72" width="14" height="34" rx="7" fill="#a89e8b" stroke="#171a24" stroke-width="3"/>
          <rect x="117" y="8" width="6" height="14" fill="#171a24"/>
          <circle cx="120" cy="8" r="7" fill="#ff8c42" stroke="#171a24" stroke-width="3"/>
          <rect x="86" y="20" width="68" height="46" rx="14" fill="#ded5c4" stroke="#171a24" stroke-width="4"/>
          <rect x="94" y="30" width="52" height="22" rx="9" fill="#20243a" stroke="#171a24" stroke-width="3"/>
          <g class="eyes">
            <circle cx="108" cy="41" r="6.5" fill="#55d6ff"/>
            <circle cx="132" cy="41" r="6.5" fill="#55d6ff"/>
            <circle cx="110" cy="39" r="2" fill="#fff"/>
            <circle cx="134" cy="39" r="2" fill="#fff"/>
          </g>
          <g>
            <line x1="70" y1="80" x2="48" y2="104" stroke="#171a24" stroke-width="18" stroke-linecap="round">
              <animate attributeName="x2" values="48;48;94;94;48" keyTimes="0;0.55;0.70;0.86;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
              <animate attributeName="y2" values="104;104;64;64;104" keyTimes="0;0.55;0.70;0.86;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
            </line>
            <line x1="70" y1="80" x2="48" y2="104" stroke="#a89e8b" stroke-width="12" stroke-linecap="round">
              <animate attributeName="x2" values="48;48;94;94;48" keyTimes="0;0.55;0.70;0.86;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
              <animate attributeName="y2" values="104;104;64;64;104" keyTimes="0;0.55;0.70;0.86;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
            </line>
            <g>
              <animateTransform attributeName="transform" type="translate"
                values="0 0;0 0;46 -40;46 -40;0 0" keyTimes="0;0.55;0.70;0.86;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
              <rect x="46" y="94" width="26" height="20" rx="4" fill="#7fb8a0" stroke="#171a24" stroke-width="3"/>
              <path d="M72 99 H78 A7 7 0 0 1 78 111 H72" fill="none" stroke="#171a24" stroke-width="3"/>
              <rect x="50" y="97" width="18" height="5" rx="2" fill="#6f4e37"/>
            </g>
          </g>
        </g>
        <g fill="none" stroke="#f2efe8" stroke-width="4" stroke-linecap="round" opacity=".9">
          <path class="steam" d="M54 92 q5 -6 0 -12"/>
          <path class="steam" d="M60 92 q5 -6 0 -12"/>
          <path class="steam" d="M48 92 q5 -6 0 -12"/>
        </g>
      </svg>
